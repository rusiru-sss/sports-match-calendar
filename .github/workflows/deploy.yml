name: Refresh match inventory and deploy site
on:
  push:
    branches: [main]
  schedule:
    - cron: '27 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'requests>=2.31,<3' 'curl_cffi>=0.7,<1' 'beautifulsoup4>=4.12,<5'
      - name: Validate collector syntax
        run: python -m py_compile scripts/fallback_feeds.py
      - name: Fetch rolling two-month fixtures with provider fallback
        run: python scripts/rebuild_calendar.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
